name: OperaGX SeleniumBase Brave

on:
  workflow_dispatch:

jobs:
  run-opera-gx:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Brave browser
        run: |
          sudo apt update
          sudo apt install -y apt-transport-https curl
          curl -fsS https://brave-browser-apt-release.s3.brave.com/brave-core.asc | sudo gpg --dearmor -o /usr/share/keyrings/brave-browser.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt update
          sudo apt install -y brave-browser

      - name: Install Python & SeleniumBase
        run: |
          sudo apt install -y python3 python3-pip xvfb
          pip install seleniumbase

      - name: Create SeleniumBase script
        run: |
          mkdir -p downloaded_files
          cat > opera_test.py << 'EOF'
          import time
          import os
          import glob
          import subprocess
          from seleniumbase import SB
          
          with SB(browser="brave", incognito=True) as sb:
              sb.open("https://www.twitch.tv/brutalles")
              time.sleep(10)
              sb.open("https://operagx.gg/brutallesaff")
              time.sleep(10)
          
              sb.click("span.cta")
          
              time.sleep(120)
          
              search_paths = [
                  "/home/runner/",
                  "/home/runner/work/",
                  "/home/runner/downloaded_files/",
                  "/tmp/",
                  os.getcwd(),
              ]
          
              found = []
              for path in search_paths:
                  found.extend(glob.glob(os.path.join(path, "**", "opera*.deb"), recursive=True))
          
              if not found:
                  raise Exception("Nu s-a găsit niciun fișier opera*.deb în sistem.")
          
              deb = found[0]
              print("Găsit:", deb)
          
              subprocess.run(["sudo", "dpkg", "-i", deb], check=True)
          
              proc = subprocess.Popen(["opera"], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              time.sleep(240)
          
              sb.save_screenshot("opera_screenshot.png")
          
              proc.terminate()
          EOF

      - name: Run SeleniumBase test
        run: |
          xvfb-run python3 opera_test.py

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: opera-gx-screenshot
          path: opera_screenshot.png
