name: Download & Run Opera GX

# Opera GX se instaleaza DOAR din https://operagx.gg/brutallesaff
# (fara curl / apt fallback). SeleniumBase descarca in ./downloaded_files

on:
  workflow_dispatch:
  # push:
  #   branches: [ main, master ]

jobs:
  opera-gx:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Listeaza continutul checkout-ului (debug)
        run: |
          echo "--- Root ---"; ls -la
          echo "--- Fisiere .py ---"; find . -name '*.py' -not -path './.git/*' || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaleaza SeleniumBase + Xvfb (pt. xvfb=True)
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase pyvirtualdisplay
          sbase install chromedriver
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Descarca Opera GX (.deb) DOAR din operagx.gg
        run: |
          mkdir -p scripts downloaded_files
          cat > scripts/opera_download.py <<'PYEOF'
          import glob, os, time, shutil
          from seleniumbase import SB

          URL = "https://operagx.gg/brutallesaff"
          DOWNLOAD_DIR = "downloaded_files"   # folderul default SeleniumBase
          WAIT_MAX = 480      # asteapta pana la 8 min (fisierul e mare)
          STABLE_SEC = 30     # .crdownload fara crestere 30s -> download oprit

          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          def final_debs():
              return [f for f in glob.glob(os.path.join(DOWNLOAD_DIR, "opera*.deb"))
                      if not f.endswith(".crdownload")]

          def crdownloads():
              out = []
              for root, _, files in os.walk(DOWNLOAD_DIR):
                  for f in files:
                      if f.endswith(".crdownload"):
                          out.append(os.path.join(root, f))
              return out

          # xvfb=True -> Chrome NON-headless sub display virtual.
          # Astfel downloadul primeste nume final corect (nu "Unconfirmed ...crdownload").
          with SB(browser="chrome", xvfb=True) as sb:
              print(f"[*] Accesam {URL} ...")
              sb.open(URL)
              sb.set_window_size(1280, 1024)
              sb.sleep(10)

              print('[*] Click pe "Download Opera GX" ...')
              selectors = [
                  "span.cta",
                  "xpath=//span[contains(@class,'cta')]",
                  "xpath=//*[contains(normalize-space(), 'Download Opera GX')]",
                  "xpath=//a[contains(., 'Download Opera')]",
              ]
              clicked = False
              for sel in selectors:
                  try:
                      sb.click(sel, timeout=12)
                      clicked = True
                      print(f"[+] Click reusit: {sel}")
                      break
                  except Exception as e:
                      print(f"[!] {sel!r} a esuat: {e}")
              if not clicked:
                  try:
                      sb.js_click("span.cta")
                      print("[+] js_click pe span.cta")
                  except Exception as e:
                      print(f"[!] js_click a esuat: {e}")

              print(f"[*] Asteptam pana la {WAIT_MAX}s pentru finalizarea downloadului ...")
              deadline = time.time() + WAIT_MAX
              last_size, stable_since = -1, None
              done = False
              while time.time() < deadline:
                  debs = final_debs()
                  if debs:
                      print(f"[+] Download finalizat: {sorted(debs)[0]}")
                      done = True
                      break
                  crs = crdownloads()
                  if crs:
                      size = sum(os.path.getsize(c) for c in crs)
                      now = time.time()
                      if size == last_size and size > 0:
                          if stable_since is None:
                              stable_since = now
                          elif now - stable_since >= STABLE_SEC:
                              # download oprit (finalizat sau blocat) dar Chrome nu l-a redenumit
                              big = max(crs, key=os.path.getsize)
                              dest = os.path.join(DOWNLOAD_DIR, "opera_gx_recovered.deb")
                              try:
                                  shutil.move(big, dest)
                                  print(f"[+] .crdownload stabil ({size} bytes) recuperat -> {dest}")
                              except Exception as e:
                                  print(f"[!] recuperare esuata: {e}")
                              done = True
                              break
                      else:
                          stable_since = None
                      last_size = size
                  time.sleep(5)

              if not done:
                  print("[!] Timeout: downloadul nu s-a finalizat in timpul alocat.")

              print("Continut downloaded_files:", os.listdir(DOWNLOAD_DIR))
          PYEOF

          python scripts/opera_download.py

      - name: Cauta .deb-ul peste tot
        id: find
        run: |
          set +e
          DEB=""
          echo ">> 1) Cautam opera*.deb in ./downloaded_files + locatii obisnuite ..."
          for d in downloaded_files "$HOME" /tmp /home "$GITHUB_WORKSPACE" .; do
            [ -d "$d" ] || continue
            hit=$(find "$d" -type f -name 'opera*.deb' ! -name '*.crdownload' 2>/dev/null | head -n1)
            [ -n "$hit" ] && { DEB="$hit"; break; }
          done
          if [ -z "$DEB" ]; then
            echo ">> 2) Cautam ORICE .deb local ..."
            for d in downloaded_files "$HOME" /tmp .; do
              [ -d "$d" ] || continue
              hit=$(find "$d" -type f -name '*.deb' ! -name '*.crdownload' 2>/dev/null | head -n1)
              [ -n "$hit" ] && { DEB="$hit"; break; }
            done
          fi
          if [ -z "$DEB" ]; then
            echo ">> 3) Cautam in tot filesystem-ul ..."
            DEB=$(find / \( -path /proc -o -path /sys -o -path /dev \) -prune -o \
                  -type f -name '*.deb' ! -name '*.crdownload' -print 2>/dev/null | head -n1)
          fi
          if [ -z "$DEB" ]; then
            echo ">> 4) Ultima sansa: recuperam cel mai mare .crdownload din operagx.gg ..."
            CR=$(find downloaded_files "$HOME" /tmp -type f -name '*.crdownload' 2>/dev/null \
                  | while read f; do echo "$(stat -c%s "$f" 2>/dev/null) $f"; done \
                  | sort -rn | head -n1 | cut -d' ' -f2-)
            if [ -n "$CR" ]; then
              DEB="downloaded_files/opera_gx_recovered.deb"
              cp -f "$CR" "$DEB"
              echo ">> Recuperat din $CR -> $DEB"
            fi
          fi
          if [ -n "$DEB" ]; then
            echo ">> Am gasit: $DEB"
            echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          else
            echo ">> NIMIC gasit."
            echo "deb=" >> "$GITHUB_OUTPUT"
          fi

      - name: Instaleaza Opera GX (doar din .deb-ul descarcat) + utilitare screenshot
        id: install
        run: |
          set -e
          DEB="${{ steps.find.outputs.deb }}"
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick scrot

          if [ -z "$DEB" ]; then
            echo "::error::Nu s-a descarcat niciun .deb de la operagx.gg."
            ls -la downloaded_files || true
            exit 1
          fi

          echo ">> Validam: $DEB"
          if ! dpkg-deb -I "$DEB" >/dev/null 2>&1; then
            echo "::error::Fisierul descarcat NU este un .deb valid (descarcarea s-a intrerupt): $DEB"
            ls -la "$DEB"
            exit 1
          fi

          echo ">> Instalam: $DEB"
          sudo dpkg -i "$DEB" || true
          sudo apt-get install -f -y
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Ruleaza Opera GX 4 minute + screenshot
        run: |
          set +e

          # Detectam binarul Opera GX instalat
          OPERA_BIN=""
          for c in opera-gx opera-gx-stable operagx opera; do
            if command -v "$c" >/dev/null 2>&1; then OPERA_BIN="$(command -v "$c")"; break; fi
          done
          if [ -z "$OPERA_BIN" ]; then
            OPERA_BIN="$(find /opt -maxdepth 3 -type f \( -name opera -o -name opera-gx \) 2>/dev/null | head -n1)"
          fi
          echo "Binar Opera GX folosit: ${OPERA_BIN:-NICIUNUL GASIT}"
          test -n "$OPERA_BIN" || { echo "::error::Nu am gasit binarul Opera GX dupa instalare"; exit 1; }

          # Display virtual (fara monitor pe runner)
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2

          # Lansam Opera GX
          "$OPERA_BIN" --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/opera-gx-profile >/tmp/opera.log 2>&1 &
          OPERA_PID=$!

          echo "[*] Opera GX ruleaza. Asteptam 4 minute (240s) ..."
          sleep 240

          # Captura de ecran
          rm -f screenshot.png
          import -window root screenshot.png 2>/dev/null \
            || scrot screenshot.png 2>/dev/null \
            || echo "::warning::Captura de ecran nu a putut fi creata."

          ls -la screenshot.png 2>/dev/null || true

          # Log-uri pentru debugging
          cp -f /tmp/opera.log ./opera.log 2>/dev/null || true
          cp -f /tmp/xvfb.log ./xvfb.log 2>/dev/null || true

          # Inchidem procesele (runnerul se opreste automat la finalul jobului)
          kill "$OPERA_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

      - name: Incarca screenshot-ul ca artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opera-gx-screenshot
          path: screenshot.png
          if-no-files-found: warn

      - name: Incarca log-urile pentru debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opera-gx-logs
          path: |
            opera.log
            xvfb.log
          if-no-files-found: ignore
