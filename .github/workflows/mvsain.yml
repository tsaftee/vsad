name: Download & Run Opera GX

on:
  workflow_dispatch:
  # push:
  #   branches: [ main, master ]

jobs:
  opera-gx:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Listeaza continutul checkout-ului (debug)
        run: |
          echo "--- Root ---"; ls -la
          echo "--- Fisiere .py ---"; find . -name '*.py' -not -path './.git/*' || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaleaza SeleniumBase
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase
          sbase install chromedriver

      - name: Descarca Opera GX (.deb) cu SeleniumBase
        run: |
          mkdir -p scripts downloaded_files
          cat > scripts/opera_download.py <<'PYEOF'
          import glob, os, time, shutil
          from seleniumbase import SB

          URL = "https://operagx.gg/brutallesaff"
          DOWNLOAD_DIR = "downloaded_files"
          WAIT_MAX = 300      # asteapta pana la 5 min (177MB nu intra in 2 min)
          STABLE_SEC = 20     # .crdownload nedeschis in crestere 20s -> download oprit

          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          def final_debs():
              return [f for f in glob.glob(os.path.join(DOWNLOAD_DIR, "opera*.deb"))
                      if not f.endswith(".crdownload")]

          def crdownloads():
              out = []
              for root, _, files in os.walk(DOWNLOAD_DIR):
                  for f in files:
                      if f.endswith(".crdownload"):
                          out.append(os.path.join(root, f))
              return out

          with SB(browser="chrome", headless=True) as sb:
              print(f"[*] Accesam {URL} ...")
              sb.open('https://www.twitch.tv/brutalles')
              sb.sleep(10)
              sb.open(URL)
              sb.set_window_size(1280, 1024)
              sb.sleep(10)

              print('[*] Click pe "Download Opera GX" ...')
              selectors = [
                  "span.cta",
                  "xpath=//span[contains(@class,'cta')]",
                  "xpath=//*[contains(normalize-space(), 'Download Opera GX')]",
                  "xpath=//a[contains(., 'Download Opera')]",
              ]
              clicked = False
              for sel in selectors:
                  try:
                      sb.click(sel, timeout=12)
                      clicked = True
                      print(f"[+] Click reusit: {sel}")
                      break
                  except Exception as e:
                      print(f"[!] {sel!r} a esuat: {e}")
              if not clicked:
                  try:
                      sb.js_click("span.cta")
                      print("[+] js_click pe span.cta")
                  except Exception as e:
                      print(f"[!] js_click a esuat: {e}")

              print(f"[*] Asteptam pana la {WAIT_MAX}s pentru finalizarea downloadului ...")
              deadline = time.time() + WAIT_MAX
              last_size, stable_since = -1, None
              done = False
              while time.time() < deadline:
                  debs = final_debs()
                  if debs:
                      print(f"[+] Download finalizat: {sorted(debs)[0]}")
                      done = True
                      break
                  crs = crdownloads()
                  if crs:
                      size = sum(os.path.getsize(c) for c in crs)
                      now = time.time()
                      if size == last_size and size > 0:
                          if stable_since is None:
                              stable_since = now
                          elif now - stable_since >= STABLE_SEC:
                              # download oprit (finalizat sau blocat) dar Chrome nu l-a redenumit
                              big = max(crs, key=os.path.getsize)
                              dest = os.path.join(DOWNLOAD_DIR, "opera_gx_recovered.deb")
                              try:
                                  shutil.move(big, dest)
                                  print(f"[+] .crdownload stabil ({size} bytes) recuperat -> {dest}")
                              except Exception as e:
                                  print(f"[!] recuperare esuata: {e}")
                              done = True
                              break
                      else:
                          stable_since = None
                      last_size = size
                  time.sleep(5)

              if not done:
                  print("[!] Timeout: downloadul nu s-a finalizat in timpul alocat (vom folosi fallback).")

              print("Continut downloaded_files:", os.listdir(DOWNLOAD_DIR))
          PYEOF

          python scripts/opera_download.py

      - name: Cauta .deb-ul peste tot
        id: find
        run: |
          set +e
          DEB=""
          echo ">> Cautam opera*.deb in locatiile obisnuite ..."
          for d in downloaded_files "$HOME" /tmp /home "$GITHUB_WORKSPACE" .; do
            [ -d "$d" ] || continue
            hit=$(find "$d" -type f -name 'opera*.deb' ! -name '*.crdownload' 2>/dev/null | head -n1)
            [ -n "$hit" ] && { DEB="$hit"; break; }
          done
          if [ -z "$DEB" ]; then
            echo ">> Nimic local. Cautam in tot filesystem-ul ..."
            DEB=$(find / \( -path /proc -o -path /sys -o -path /dev \) -prune -o \
                  -type f -name 'opera*.deb' ! -name '*.crdownload' -print 2>/dev/null | head -n1)
          fi
          if [ -n "$DEB" ]; then
            echo ">> Am gasit deb: $DEB"
            echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          else
            echo ">> Nu am gasit deb (vom folosi fallback curl / apt)."
            echo "deb=" >> "$GITHUB_OUTPUT"
          fi

      - name: Instaleaza Opera GX (3 strategii) + utilitare screenshot
        id: install
        run: |
          set +e
          DEB="${{ steps.find.outputs.deb }}"
          echo ">> Deb propus: '${DEB}'"

          sudo apt-get update
          sudo apt-get install -y curl wget xvfb imagemagick scrot ca-certificates gnupg

          install_deb() {
            local f="$1"
            [ -f "$f" ] || { echo "   fisier inexistent: $f"; return 1; }
            dpkg-deb -I "$f" >/dev/null 2>&1 || { echo "   deb invalid/corupt: $f"; return 1; }
            echo "   Instalam deb valid: $f"
            sudo dpkg -i "$f" || true
            sudo apt-get install -f -y
            return 0
          }

          INSTALLED=0

          # (1) deb-ul descarcat prin SeleniumBase
          if [ -n "$DEB" ]; then
            echo ">> [1/3] Incercam deb-ul din browser."
            install_deb "$DEB" && INSTALLED=1
          fi

          # (2) fallback: download direct de la endpoint-ul oficial Opera
          if [ "$INSTALLED" = "0" ]; then
            echo ">> [2/3] Fallback curl: descarcam .deb direct de la Opera."
            rm -f opera-gx.deb
            curl -fL "https://download.opera.com/download/get/?partner=www&opsys=Linux&product=Opera+GX" \
                 -o opera-gx.deb 2>/dev/null
            install_deb "$(pwd)/opera-gx.deb" && INSTALLED=1
          fi

          # (3) fallback final: depozitul APT oficial Opera GX
          if [ "$INSTALLED" = "0" ]; then
            echo ">> [3/3] Fallback APT: instalam din depozitul oficial Opera GX."
            wget -qO- https://deb.opera.com/archive.key | gpg --dearmor \
              | sudo dd of=/usr/share/keyrings/opera-browser.gpg 2>/dev/null
            echo "deb [signed-by=/usr/share/keyrings/opera-browser.gpg] https://deb.opera.com/opera-gx-stable/ stable non-free" \
              | sudo dd of=/etc/apt/sources.list.d/opera-archive.list 2>/dev/null
            sudo apt-get update
            sudo apt-get install -y opera-gx-stable && INSTALLED=1
          fi

          [ "$INSTALLED" = "1" ] || { echo "::error::Nu am putut instala Opera GX prin nicio metoda"; exit 1; }
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Ruleaza Opera GX 4 minute + screenshot
        run: |
          set +e

          # Detectam binarul Opera GX instalat
          OPERA_BIN=""
          for c in opera-gx opera-gx-stable operagx opera; do
            if command -v "$c" >/dev/null 2>&1; then OPERA_BIN="$(command -v "$c")"; break; fi
          done
          if [ -z "$OPERA_BIN" ]; then
            OPERA_BIN="$(find /opt -maxdepth 3 -type f \( -name opera -o -name opera-gx \) 2>/dev/null | head -n1)"
          fi
          echo "Binar Opera GX folosit: ${OPERA_BIN:-NICIUNUL GASIT}"
          test -n "$OPERA_BIN" || { echo "::error::Nu am gasit binarul Opera GX dupa instalare"; exit 1; }

          # Display virtual (fara monitor pe runner)
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2

          # Lansam Opera GX
          "$OPERA_BIN" --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/opera-gx-profile >/tmp/opera.log 2>&1 &
          OPERA_PID=$!

          echo "[*] Opera GX ruleaza. Asteptam 4 minute (240s) ..."
          sleep 240

          # Captura de ecran
          rm -f screenshot.png
          import -window root screenshot.png 2>/dev/null \
            || scrot screenshot.png 2>/dev/null \
            || echo "::warning::Captura de ecran nu a putut fi creata."

          ls -la screenshot.png 2>/dev/null || true

          # Log-uri pentru debugging
          cp -f /tmp/opera.log ./opera.log 2>/dev/null || true
          cp -f /tmp/xvfb.log ./xvfb.log 2>/dev/null || true

          # Inchidem procesele (runnerul se opreste automat la finalul jobului)
          kill "$OPERA_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true

      - name: Incarca screenshot-ul ca artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opera-gx-screenshot
          path: screenshot.png
          if-no-files-found: warn

      - name: Incarca log-urile pentru debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opera-gx-logs
          path: |
            opera.log
            xvfb.log
          if-no-files-found: ignore
