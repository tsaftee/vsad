name: Run Docker Image

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Pull image
        run: docker pull tsaftee/tey

      - name: Create container
        run: docker create --name opera-test tsaftee/tey

      - name: Run container
        run: docker start -a opera-test

      - name: Copy screenshot
        run: |
          mkdir -p output
          docker cp opera-test:/output/opera_gx_screenshot.png output/

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: opera-gx-screenshot
          path: output/opera_gx_screenshot.png

      - name: Cleanup
        if: always()
        run: docker rm -f opera-test
